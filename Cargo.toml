[package]
name = "scx_truther"
version = "0.5.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A useless scheduler for sched-ext (rustland-core) that dispenses astrology, conspiracy theories, numerology, and cryptid sightings instead of scheduling anything"

[dependencies]
scx_rustland_core = "2.4.14"
scx_utils = "1.1.3"
anyhow = "1"
plain = "0.2"
procfs = "0.18"
ctrlc = { version = "3", features = ["termination"] }
libbpf-rs = "=0.26.2"
libc = "0.2"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
scx_cargo = "1.1.3"
scx_rustland_core = "2.4.14"

[lib]
name = "scx_truther"
path = "src/lib.rs"

[[bin]]
name = "scx_truther"
path = "src/main.rs"

[profile.release]
lto = "thin"

[profile.release-tiny]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 32
panic = "abort"
