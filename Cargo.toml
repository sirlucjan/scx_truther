[package]
name = "scx_truther"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A non-competitive demo scheduler for sched-ext (rustland-core)"

[dependencies]
scx_rustland_core = "2.4.12"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
scx_cargo = "1.1.1"

[lib]
name = "scx_truther"
path = "src/lib.rs"

[[bin]]
name = "scx_truther"
path = "src/main.rs"

[profile.release]
lto = "thin"

[profile.release-tiny]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 32
panic = "abort"
